name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GhosttyKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ghosttykit.sh || echo "::warning::GhosttyKit release missing; run the GhosttyKit workflow"
      - run: swift build
      - run: swift test
