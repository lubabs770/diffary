name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch GhosttyKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ghosttykit.sh
      - run: swift build
      - run: swift test --no-parallel
